{% extends 'base.html' %}

{% block title %}{% if info %}Ma'lumotni Tahrirlash{% else %}Yangi Ma'lumot{% endif %}{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">ℹ️ {% if info %}Ma'lumotni Tahrirlash{% else %}Yangi Ma'lumot{% endif %}</h1>
</div>

<div class="card" style="max-width: 600px; margin: 0 auto;">
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <div style="margin-top: 20px;">
            <button type="submit" class="btn btn-primary">Saqlash</button>
            <a href="{% url 'bot:settings_list' %}" class="btn btn-secondary">Bekor qilish</a>
        </div>
    </form>
</div>
{% endblock %}
