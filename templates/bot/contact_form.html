{% block content %}
<div class="page-header">
    <h1 class="page-title">📞 {% if contact %}Kontaktni Tahrirlash{% else %}Yangi Kontakt{% endif %}</h1>
</div>

<div class="card" style="max-width: 600px; margin: 0 auto;">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div style="margin-top: 20px;">
            <button type="submit" class="btn btn-primary">Saqlash</button>
            <a href="{% url 'bot:settings_list' %}" class="btn btn-secondary">Bekor qilish</a>
        </div>
    </form>
</div>
{% endblock %}
