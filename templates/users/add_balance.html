{% extends 'base.html' %}

{% block title %}Balans qo'shish - {{ user_obj.username }}{% endblock %}

{% block content %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

<div class="page-header">
    <h1 class="page-title"><i class="bi bi-plus-circle"></i> Balans qo'shish</h1>
    <a href="/users/{{ user_obj.id }}/" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Orqaga</a>
</div>

<div class="card" style="max-width: 500px;">
    <h3 style="margin-bottom: 20px;">{{ user_obj.username }}</h3>
    <p style="margin-bottom: 20px;">Joriy balans: <strong>{{ user_obj.balance|floatformat:0 }} so'm</strong></p>
    
    <form method="post">
        {% csrf_token %}
        
        <label style="display: block; font-weight: 500; margin-bottom: 8px;"><i class="bi bi-wallet2"></i> Qo'shiladigan summa (so'm)</label>
        <input type="number" name="amount" step="0.01" min="0" required autofocus
               style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 16px;">
        
        <label style="display: block; font-weight: 500; margin-bottom: 8px;"><i class="bi bi-chat-left-text"></i> Izoh</label>
        <textarea name="note" rows="3" 
                  style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 16px; resize: vertical;" 
                  placeholder="Nima uchun qo'shilmoqda..."></textarea>
        
        <div style="display: flex; gap: 10px; margin-top: 24px;">
            <button type="submit" class="btn"><i class="bi bi-check-lg"></i> Qo'shish</button>
            <a href="/users/{{ user_obj.id }}/" class="btn btn-secondary"><i class="bi bi-x"></i> Bekor qilish</a>
        </div>
    </form>
</div>
{% endblock %}
